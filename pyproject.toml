[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-resilience-skills"
version = "0.1.0"
description = "Reusable AI agent skill for calm, honest recovery under pressure, ambiguity, and tool failure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Agent Resilience Skills contributors" }
]
keywords = ["ai-agents", "resilience", "reliability", "evals", "prompting", "fpa", "accounting", "general-ledger"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pandas>=2.1", "numpy>=1.26", "openpyxl>=3.1"]
finance = ["pandas>=2.1", "numpy>=1.26", "openpyxl>=3.1"]
agent = ["langgraph>=1.0", "langchain-anthropic>=1.0"]

[tool.setuptools]
packages = ["runtime", "runtime.finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
